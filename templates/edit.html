{% extends "base.html" %}
{% block title %}编辑员工 — 员工管理系统{% endblock %}
{% block content %}

<div class="page-header">
    <h1>✏️ 编辑员工信息</h1>
    <a href="{{ url_for('index') }}" class="btn btn-outline">← 返回列表</a>
</div>

<div class="form-card">
    <form method="POST" action="{{ url_for('edit', id=employee.id) }}" class="employee-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-row">
            <div class="form-group">
                <label for="name">姓名 <span class="required">*</span></label>
                <input type="text" id="name" name="name" class="input" required value="{{ employee.name }}">
            </div>
            <div class="form-group">
                <label for="gender">性别 <span class="required">*</span></label>
                <select id="gender" name="gender" class="input" required>
                    <option value="男" {{ 'selected' if employee.gender == '男' }}>男</option>
                    <option value="女" {{ 'selected' if employee.gender == '女' }}>女</option>
                </select>
            </div>
            <div class="form-group">
                <label for="position">岗位/职务</label>
                <input type="text" id="position" name="position" class="input" value="{{ employee.position or '' }}" placeholder="例：所长、技术员">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="team_station">现班组/井站</label>
                <input type="text" id="team_station" name="team_station" class="input" value="{{ employee.team_station or '' }}" placeholder="例：所领导、采气一队">
            </div>
            <div class="form-group">
                <label for="age">年龄</label>
                <input type="number" id="age" name="age" class="input" min="16" max="100" value="{{ employee.age or '' }}" placeholder="例：28">
            </div>
            <div class="form-group">
                <label for="birthplace">出生地</label>
                <input type="text" id="birthplace" name="birthplace" class="input" value="{{ employee.birthplace or '' }}" placeholder="例：北京市朝阳区">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group" style="grid-column: span 3;">
                <label for="work_content">分管工作内容</label>
                <textarea id="work_content" name="work_content" class="input" rows="3" placeholder="请填写分管工作内容">{{ employee.work_content or '' }}</textarea>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group" style="grid-column: span 3;">
                <label for="remarks">备注</label>
                <textarea id="remarks" name="remarks" class="input" rows="2" placeholder="备注信息">{{ employee.remarks or '' }}</textarea>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="department">部门</label>
                <input type="text" id="department" name="department" class="input" value="{{ employee.department or '' }}" placeholder="例：技术部">
            </div>
            <div class="form-group">
                <label for="phone">联系电话</label>
                <input type="tel" id="phone" name="phone" class="input" value="{{ employee.phone or '' }}" placeholder="例：13800000000">
            </div>
            <div class="form-group">
                <label for="email">电子邮箱</label>
                <input type="email" id="email" name="email" class="input" value="{{ employee.email or '' }}" placeholder="例：name@company.com">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="hire_date">入职日期</label>
                <input type="date" id="hire_date" name="hire_date" class="input"
                       value="{{ employee.hire_date.strftime('%Y-%m-%d') if employee.hire_date else '' }}">
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">💾 更新</button>
            <a href="{{ url_for('index') }}" class="btn btn-outline">取消</a>
        </div>
    </form>
</div>

{% endblock %}
