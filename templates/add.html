{% extends "base.html" %}
{% block title %}新增员工 — 员工管理系统{% endblock %}
{% block content %}

<div class="page-header">
    <h1>➕ 新增员工</h1>
    <a href="{{ url_for('index') }}" class="btn btn-outline">← 返回列表</a>
</div>

<div class="form-card">
    <form method="POST" action="{{ url_for('add') }}" class="employee-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-row">
            <div class="form-group">
                <label for="name">姓名 <span class="required">*</span></label>
                <input type="text" id="name" name="name" class="input" required placeholder="请输入姓名">
            </div>
            <div class="form-group">
                <label for="gender">性别 <span class="required">*</span></label>
                <select id="gender" name="gender" class="input" required>
                    <option value="">请选择</option>
                    <option value="男">男</option>
                    <option value="女">女</option>
                </select>
            </div>
            <div class="form-group">
                <label for="age">年龄 <span class="required">*</span></label>
                <input type="number" id="age" name="age" class="input" required min="16" max="100" placeholder="例：28">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="birthplace">出生地 <span class="required">*</span></label>
                <input type="text" id="birthplace" name="birthplace" class="input" required placeholder="例：北京市朝阳区">
            </div>
            <div class="form-group">
                <label for="department">部门</label>
                <input type="text" id="department" name="department" class="input" placeholder="例：技术部">
            </div>
            <div class="form-group">
                <label for="position">职位</label>
                <input type="text" id="position" name="position" class="input" placeholder="例：软件工程师">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="phone">联系电话</label>
                <input type="tel" id="phone" name="phone" class="input" placeholder="例：13800000000">
            </div>
            <div class="form-group">
                <label for="email">电子邮箱</label>
                <input type="email" id="email" name="email" class="input" placeholder="例：zhangsan@company.com">
            </div>
            <div class="form-group">
                <label for="hire_date">入职日期</label>
                <input type="date" id="hire_date" name="hire_date" class="input">
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">💾 保存</button>
            <a href="{{ url_for('index') }}" class="btn btn-outline">取消</a>
        </div>
    </form>
</div>

{% endblock %}
