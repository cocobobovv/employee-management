{% extends "base.html" %}
{% block title %}{{ code }} — 员工管理系统{% endblock %}
{% block content %}

<div class="empty-state">
    <div class="empty-icon">{{ '🔍' if code == 404 else '⚠️' }}</div>
    <h3>{{ code }} — {{ message }}</h3>
    <p>
        {% if code == 404 %}
            您访问的页面不存在，请检查链接是否正确。
        {% else %}
            服务器遇到了意外错误，请稍后重试。
        {% endif %}
    </p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">🏠 返回首页</a>
</div>

{% endblock %}
